<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<body>
    
<header th:replace="fragments/header :: header"></header>
    
    <h1>Nueva Sucursal</h1>

    <form th:action="@{/sucursales/nueva}" th:object="${s}" method="post" >

        <label>Nombre de la nueva sucursal</label>
        <input type="text" th:field="*{nombre}">
        <div th:errors="*{nombre}"></div>

         <label>Direccion</label>
        <input type="text" th:field="*{direccion}">
        <div th:errors="*{direccion}"></div>

        <button type="submit">Enviar</button>

    </form>

     <a th:href="@{/sucursales}">Volver</a>
</body>
</html>
