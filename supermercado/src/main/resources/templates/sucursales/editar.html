<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1 th:text="|Editar la sucursal: ${s.nombre}|"></h1>

    <form th:action="@{/sucursales/editar/{id}(id=${s.id})}" th:object="${s}" method="post">

        <label>Nombre</label>
        <input type="text" th:field="*{nombre}">
        <div th:errors="*{nombre}"></div>

        <label>Direccion</label>
        <input type="text" th:field="*{direccion}">
        <div th:errors="*{direccion}"></div>

        <button type="submit">Enviar</button>

    </form>

    <a th:href="@{/sucursales}">Volver</a>

</body>
</html>
