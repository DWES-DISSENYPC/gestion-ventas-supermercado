<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<body>

<header th:replace="fragments/header :: header"></header>

    <h1>Nuevo producto</h1>

    <form th:action="@{/productos/nuevo}" method="post" th:object="${p}">

        <label> Nombre</label>
        <input type="text" th:field="*{nombre}">
        <div th:errors="*{nombre}"></div>

        <label> Precio</label>
        <input type="number" th:field="*{precio}" step="0.01" min="0">
         <div th:errors="*{precio}"></div>

         <label>Categoria</label>
         <input type="text" th:field="*{categoria}">
         <div th:errors="*{categoria}"></div>
        <button type="submit">Enviar</button>

    </form>

</body>

</html>
