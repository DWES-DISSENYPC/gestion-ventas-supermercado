<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Editar Producto</h1>

    <form th:action="@{/productos/editar/{id}(id=${p.id})}" th:object="${p}" method="post">

        <label>Nombre</label>
        <input type="text" th:field="*{nombre}">
        <p th:errors="*{nombre}"></p>

        <label>Categoria</label>
        <input type="text" th:field="*{categoria}">
        <p th:errors="*{categoria}"></p>

        <label>Precio</label>
        <input type="number" th:field="*{precio}" step="0.01" min="0" >

        <button type="submit">Enviar</button>



    </form>


</body>
</html>
